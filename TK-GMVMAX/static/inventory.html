<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK-GMVMAX-FBT面板 · 库存监管</title>
<script>try{if(localStorage.getItem('gmvTheme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="/static/inventory.css">
</head>
<body>
<div class="app">
  <div class="header">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6" y2="6"/><line x1="10" y1="6" x2="10" y2="6"/><line x1="6" y1="18" x2="6" y2="18"/><line x1="10" y1="18" x2="10" y2="18"/></svg>
      FBT 库存监管
      <small>Fulfillment by TikTok 库存健康面板</small>
    </h1>
    <div class="header-info">
      <span class="data-time" id="dataTime">加载中...</span>
      <span style="font-size:12px;color:var(--text2)">每60秒自动检测更新</span>
      <button class="refresh-btn" onclick="fetchData()">更新数据</button>
      <button class="refresh-btn" style="background:#64748b" onclick="location.reload()">重新加载</button>
      <button class="refresh-btn" style="background:#475569" onclick="toggleTheme()" title="切换深色 / 浅色模式">🌓</button>
    </div>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-row" id="kpiRow"></div>

  <!-- Charts Row 1 -->
  <div class="chart-grid-3" id="chartsRow1"></div>

  <!-- Charts Row 2 -->
  <div class="chart-grid" id="chartsRow2"></div>

  <!-- Inventory Aging Chart -->
  <div class="chart-grid" style="margin-bottom:20px">
    <div class="chart-card full" id="agingChartCard">
      <h3>库存账龄分布</h3>
      <div class="chart-canvas-container"><canvas id="agingChart" height="300"></canvas>
        <div class="chart-tooltip" id="agingTooltip"></div></div>
    </div>
  </div>

  <!-- Table -->
  <div class="chart-card" style="margin-bottom:20px">
    <h3>SKU 详细清单</h3>
    <div class="table-controls">
      <input type="text" id="searchInput" placeholder="搜索 SKU、商品名称..." oninput="filterTable()">
      <select id="statusFilter" onchange="filterTable()">
        <option value="">全部状态</option>
        <option value="健康">健康</option>
        <option value="缺货">缺货</option>
        <option value="即将缺货">即将缺货</option>
      </select>
      <span class="row-count" id="rowCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="tableHeaders"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/static/inventory.js"></script>
</body>
</html>
